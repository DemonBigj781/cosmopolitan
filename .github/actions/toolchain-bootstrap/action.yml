name: Pinned toolchain bootstrap
description: Verify Cosmocc, fetch pinned Machin, and optionally stage Rust with notices
inputs:
  rust-compiler:
    description: Stage the pinned Rust compiler sysroot for embedding
    default: 'false'
outputs:
  rust-linker-probe:
    description: Exact Rust version for the standalone object/linker probe
    value: ${{ steps.pins.outputs.rust_linker_probe }}
runs:
  using: composite
  steps:
    - name: Read canonical bootstrap pins
      id: pins
      shell: bash
      run: python3 toolchain/bootstrap.py pins --github-output "$GITHUB_OUTPUT"
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ steps.pins.outputs.go_version }}
        cache: false
    - name: Bootstrap verified Cosmocc and pinned Machin
      shell: bash
      run: |
        python3 toolchain/bootstrap.py sdk /tmp/cosmocc
        python3 toolchain/bootstrap.py machin /tmp/machin /tmp/machin-compiler
    - name: Stage Rust compiler and distribution notices
      if: inputs.rust-compiler == 'true'
      shell: bash
      env:
        RUST_NIGHTLY: ${{ steps.pins.outputs.rust_nightly }}
      run: |
        rustup toolchain install "$RUST_NIGHTLY" --profile minimal
        rustup target add aarch64-unknown-linux-gnu --toolchain "$RUST_NIGHTLY"
        RUSTC="$(rustup which --toolchain "$RUST_NIGHTLY" rustc)"
        SYSROOT="$(dirname "$(dirname "$RUSTC")")"
        python3 toolchain/bootstrap.py stage-rust "$SYSROOT" /tmp/rust-embedded
        /tmp/rust-embedded/bin/rustc --version
