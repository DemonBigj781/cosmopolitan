name: C++ standard library integration validation
on:
  workflow_dispatch:
  push:
    branches: [machin-cosmopolitan]
    paths:
      - 'toolchain/**'
      - '.github/actions/toolchain-bootstrap/**'
      - 'build/download-cosmocc.sh'
      - 'third_party/rust_ape/upstream/xtask/src/config.rs'
      - 'third_party/rust_ape/upstream/rust-toolchain.toml'
      - '.github/workflows/cpp-stdlib-audit.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bootstrap pinned toolchain inputs
        id: bootstrap
        uses: ./.github/actions/toolchain-bootstrap
      - name: Build bootstrap APE
        run: |
          COSMOCC="$(find /tmp/cosmocc -type f -name cosmocc | head -n1)"
          test -n "$COSMOCC"
          COSMOCC="$COSMOCC" sh toolchain/build.sh
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y make
      - name: Package embedded SDK
        run: |
          COSMOCC="$(find /tmp/cosmocc -type f -name cosmocc | head -n1)"
          COSMOCC="$COSMOCC" COSMOCC_ROOT=/tmp/cosmocc MACHIN=/tmp/machin-compiler MACHIN_SRC=/tmp/machin bash toolchain/package-compiler-sdk.sh
      - name: Inventory SDK C++ headers, libraries and compiler drivers
        shell: bash
        run: |
          set -euo pipefail
          echo '== Candidate C++ headers =='
          find /tmp/cosmocc -type f \( -name string -o -name vector -o -name memory -o -name typeinfo -o -name cstdio \) -print | head -80
          echo '== Candidate C++ libraries =='
          find /tmp/cosmocc -type f \( -name '*stdc++*' -o -name '*c++abi*' -o -name 'libc++.a' -o -name '*supc++*' \) -print | head -80
          echo '== Compiler frontends =='
          find /tmp/cosmocc -type f \( -name 'cosmoc++' -o -name '*g++' -o -name 'cosmocc' \) -print | head -80
          echo '== Repository C++ support files =='
          find third_party libc -maxdepth 5 \( -iname '*libcxx*' -o -iname '*libc++*' -o -iname '*stdc++*' \) -print | head -80 || true
      - name: Probe packaged C++ headers and RTTI without host fallback
        shell: bash
        run: |
          set -euo pipefail
          APE="$GITHUB_WORKSPACE/o/toolchain/compiler-payload/toolchain-with-sdk.com"
          mkdir -p /tmp/cpp-sdk-audit
          cd /tmp/cpp-sdk-audit
          cat > headers.cpp <<'EOF'
          #include <string>
          #include <vector>
          #include <memory>
          #include <typeinfo>
          #include <cstdio>
          int main() {
            std::vector<int> v{42};
            std::string s="ok";
            auto p=std::make_unique<int>(v[0]);
            std::printf("C++ STL: %d %s\n", *p, s.c_str());
            return *p == 42 ? 0 : 1;
          }
          EOF
          set +e
          "$APE" c++ -std=c++17 headers.cpp -o headers.com >compile.log 2>&1
          status=$?
          set -e
          echo "Header compilation exit status: $status"
          cat compile.log
          if [ "$status" -ne 0 ]; then
            echo 'FAIL: packaged C++ compile/link' >&2
            exit "$status"
          fi
          ./headers.com | grep -Fx 'C++ STL: 42 ok'
          echo 'PASS: embedded C++ STL compilation, linking and execution'
      - name: Publish SDK audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpp-stdlib-sdk-audit
          path: /tmp/cpp-sdk-audit/compile.log
          if-no-files-found: warn
