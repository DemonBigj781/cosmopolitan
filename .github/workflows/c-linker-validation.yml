name: C compiler and linker validation
on:
  workflow_dispatch:
  push:
    branches: [machin-cosmopolitan]
    paths:
      - 'toolchain/**'
      - '.github/workflows/c-linker-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Cosmopolitan SDK
        run: |
          curl -fL --retry 3 https://cosmo.zip/pub/cosmocc/cosmocc.zip -o /tmp/cosmocc.zip
          mkdir -p /tmp/cosmocc
          unzip -q /tmp/cosmocc.zip -d /tmp/cosmocc
      - name: Build bootstrap APE
        run: |
          COSMOCC="$(find /tmp/cosmocc -type f -name cosmocc | head -n1)"
          test -n "$COSMOCC"
          COSMOCC="$COSMOCC" sh toolchain/build.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Prepare Machin bootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y make
          git clone --depth 1 https://github.com/javimosch/machin.git /tmp/machin
          cd /tmp/machin
          go build -o /tmp/machin-compiler .
      - name: Package embedded compiler
        run: |
          COSMOCC="$(find /tmp/cosmocc -type f -name cosmocc | head -n1)"
          COSMOCC="$COSMOCC" COSMOCC_ROOT=/tmp/cosmocc MACHIN=/tmp/machin-compiler MACHIN_SRC=/tmp/machin bash toolchain/package-compiler-sdk.sh
      - name: Validate C compiler and linker through embedded APE
        shell: bash
        run: |
          set -euo pipefail
          APE="$GITHUB_WORKSPACE/o/toolchain/compiler-payload/toolchain-with-sdk.com"
          mkdir -p /tmp/c-linker-validation
          cd /tmp/c-linker-validation
          cat > math.c <<'EOF'
          int add(int a, int b) { return a + b; }
          EOF
          cat > main.c <<'EOF'
          #include <stdio.h>
          extern int add(int, int);
          int main(void) {
            int value = add(19, 23);
            printf("C LINK PASS: %d\n", value);
            return value == 42 ? 0 : 1;
          }
          EOF
          "$APE" cc -c math.c -o math.o
          "$APE" cc -c main.c -o main.o
          test -s math.o && test -s main.o
          "$APE" cc main.o math.o -o linked.com
          test "$(./linked.com)" = 'C LINK PASS: 42'
          echo 'PASS: separate C compilation, cross-object symbols, APE link and execution'
          cat > missing.c <<'EOF'
          extern int missing_symbol(void);
          int main(void) { return missing_symbol(); }
          EOF
          if "$APE" cc missing.c -o missing.com >missing.log 2>&1; then
            echo 'FAIL: unresolved external unexpectedly linked' >&2
            exit 1
          fi
          echo 'PASS: unresolved symbol correctly rejected'
          cat > invalid.c <<'EOF'
          int main(void) { this is not valid C; }
          EOF
          if "$APE" cc -c invalid.c -o invalid.o >invalid.log 2>&1; then
            echo 'FAIL: invalid C unexpectedly compiled' >&2
            exit 1
          fi
          echo 'PASS: invalid C correctly rejected'
          echo 'ALL C COMPILER/LINKER CHECKS PASSED'

      - name: Advanced C object and static archive linking
        shell: bash
        run: |
          set -euo pipefail
          APE="$GITHUB_WORKSPACE/o/toolchain/compiler-payload/toolchain-with-sdk.com"
          mkdir -p /tmp/c-linker-advanced
          cd /tmp/c-linker-advanced
          cat > state.c <<'EOF'
          int shared_counter = 7;
          int bump(int amount) {
            shared_counter += amount;
            return shared_counter;
          }
          EOF
          cat > callback.c <<'EOF'
          extern int bump(int);
          int invoke(int (*callback)(int), int x) {
            return callback(x);
          }
          int apply(int x) { return invoke(bump, x); }
          EOF
          cat > main.c <<'EOF'
          #include <stdio.h>
          extern int shared_counter;
          extern int apply(int);
          int main(void) {
            int first = apply(5);
            int second = apply(30);
            printf("ADVANCED C PASS: %d %d %d\\n", first, second, shared_counter);
            return first == 12 && second == 42 && shared_counter == 42 ? 0 : 1;
          }
          EOF
          "$APE" cc -std=c11 -O2 -c state.c -o state.o
          "$APE" cc -std=c11 -O2 -c callback.c -o callback.o
          "$APE" cc -std=c11 -O2 -c main.c -o main.o
          test -s state.o && test -s callback.o && test -s main.o
          # Archive construction uses the CI host archiver; object generation
          # and final executable linking MUST use the embedded compiler.
          ar rcs libadvanced.a state.o callback.o
          test -s libadvanced.a
          # Build real ARM64 companion archive required by multiarch cosmocc.
          ARM_CC="$(find /tmp/cosmocc -type f -name 'aarch64-linux-cosmo-gcc' | head -n1)"
          test -n "$ARM_CC" || { echo 'ARM64 SDK compiler missing'; exit 1; }
          mkdir -p .aarch64
          "$ARM_CC" -nostdinc -include "$GITHUB_WORKSPACE/libc/integral/normalize.inc" -I"$GITHUB_WORKSPACE" -std=c11 -O2 -c state.c -o .aarch64/state.o
          "$ARM_CC" -nostdinc -include "$GITHUB_WORKSPACE/libc/integral/normalize.inc" -I"$GITHUB_WORKSPACE" -std=c11 -O2 -c callback.c -o .aarch64/callback.o
          ar rcs .aarch64/libadvanced.a .aarch64/state.o .aarch64/callback.o
          test -s .aarch64/libadvanced.a
          "$APE" cc main.o ./libadvanced.a -o advanced.com
          test "$(./advanced.com)" = 'ADVANCED C PASS: 12 42 42'
          echo 'PASS: static archive, global data, callbacks, multiple objects'
          # A missing archive must fail, not silently create a partial APE.
          if "$APE" cc main.o ./missing-library.a -o missing-library.com >missing-library.log 2>&1; then
            echo 'FAIL: missing archive unexpectedly linked' >&2
            exit 1
          fi
          echo 'PASS: missing archive correctly rejected'
          # An archive with no matching symbols must also fail.
          cat > unrelated.c <<'EOF'
          int unrelated(void) { return 1; }
          EOF
          "$APE" cc -c unrelated.c -o unrelated.o
          ar rcs libunrelated.a unrelated.o
          "$ARM_CC" -nostdinc -include "$GITHUB_WORKSPACE/libc/integral/normalize.inc" -I"$GITHUB_WORKSPACE" -c unrelated.c -o .aarch64/unrelated.o
          ar rcs .aarch64/libunrelated.a .aarch64/unrelated.o
          if "$APE" cc main.o ./libunrelated.a -o unresolved-archive.com >unresolved-archive.log 2>&1; then
            echo 'FAIL: unresolved archive symbols unexpectedly linked' >&2
            exit 1
          fi
          echo 'PASS: archive symbol resolution failures correctly rejected'
          echo 'ALL ADVANCED C LINKER CHECKS PASSED'
