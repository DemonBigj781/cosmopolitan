name: Rust no_std object and APE linker validation
on:
  workflow_dispatch:
  push:
    branches: [machin-cosmopolitan]
    paths:
      - 'toolchain/**'
      - '.github/actions/toolchain-bootstrap/**'
      - 'build/download-cosmocc.sh'
      - 'third_party/rust_ape/upstream/xtask/src/config.rs'
      - 'third_party/rust_ape/upstream/rust-toolchain.toml'
      - '.github/workflows/rust-linker-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bootstrap pinned toolchain inputs
        id: bootstrap
        uses: ./.github/actions/toolchain-bootstrap
      - name: Build bootstrap APE
        run: |
          COSMOCC="$(find /tmp/cosmocc -type f -name cosmocc | head -n1)"
          test -n "$COSMOCC"
          COSMOCC="$COSMOCC" sh toolchain/build.sh
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y make
      - name: Package embedded SDK
        run: |
          COSMOCC="$(find /tmp/cosmocc -type f -name cosmocc | head -n1)"
          COSMOCC="$COSMOCC" COSMOCC_ROOT=/tmp/cosmocc MACHIN=/tmp/machin-compiler MACHIN_SRC=/tmp/machin bash toolchain/package-compiler-sdk.sh
      - name: Install pinned Rust object/linker probe compiler
        env:
          RUST_PROBE: ${{ steps.bootstrap.outputs.rust-linker-probe }}
        run: |
          rustup toolchain install "$RUST_PROBE" --profile minimal --target aarch64-unknown-linux-gnu
          echo "RUSTUP_TOOLCHAIN=$RUST_PROBE" >> "$GITHUB_ENV"
      - name: Compile Rust no_std and link with embedded Cosmopolitan
        shell: bash
        run: |
          set -euo pipefail
          APE="$GITHUB_WORKSPACE/o/toolchain/compiler-payload/toolchain-with-sdk.com"
          mkdir -p /tmp/rust-linker
          cd /tmp/rust-linker
          cat > math.rs <<'EOF'
          #![no_std]
          #[unsafe(no_mangle)]
          pub extern "C" fn rust_multiply(a: i32, b: i32) -> i32 {
              a * b
          }
          EOF
          cat > main.c <<'EOF'
          #include <stdio.h>
          extern int rust_multiply(int, int);
          int main(void) {
            int n = rust_multiply(6, 7);
            printf("RUST C ABI PASS: %d\n", n);
            return n == 42 ? 0 : 1;
          }
          EOF
          rustc --version
          rustc --edition=2024 --crate-type=lib --emit=obj -C panic=abort -C opt-level=2 math.rs -o math.o
          test -s math.o
          mkdir -p .aarch64
          rustc --edition=2024 --target aarch64-unknown-linux-gnu --crate-type=lib --emit=obj -C panic=abort -C opt-level=2 math.rs -o .aarch64/math.o
          test -s .aarch64/math.o
          file math.o .aarch64/math.o
          "$APE" cc -c main.c -o main.o
          "$APE" cc main.o math.o -o rust-c-ape.com
          output="$(./rust-c-ape.com)" || { echo 'FAIL: linked Rust APE exited nonzero' >&2; exit 1; }
          printf 'Actual output: <%s>\n' "$output"
          test "$output" = 'RUST C ABI PASS: 42'
          echo 'PASS: Rust no_std object linked and executed in Cosmopolitan APE'
      - name: Reject unresolved Rust symbols
        shell: bash
        run: |
          set -euo pipefail
          APE="$GITHUB_WORKSPACE/o/toolchain/compiler-payload/toolchain-with-sdk.com"
          cd /tmp/rust-linker
          cat > missing.c <<'EOF'
          extern int missing_rust_symbol(void);
          int main(void) { return missing_rust_symbol(); }
          EOF
          "$APE" cc -c missing.c -o missing.o
          if "$APE" cc missing.o math.o -o missing.com >missing.log 2>&1; then
            echo 'FAIL: unresolved Rust/C symbol unexpectedly linked' >&2
            exit 1
          fi
          grep -F 'missing_rust_symbol' missing.log
          echo 'PASS: unresolved symbol correctly rejected'
