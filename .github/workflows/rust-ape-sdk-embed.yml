name: Embedded patched Rust-APE SDK packaging
on:
  push:
    branches: [machin-cosmopolitan]
    paths:
      - 'toolchain/**'
      - '.github/workflows/rust-ape-sdk-embed.yml'
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Cosmopolitan SDK
        run: |
          curl -fL --retry 3 https://cosmo.zip/pub/cosmocc/cosmocc.zip -o /tmp/cosmocc.zip
          mkdir -p /tmp/cosmocc
          unzip -q /tmp/cosmocc.zip -d /tmp/cosmocc
      - name: Build bootstrap APE
        run: |
          COSMOCC="$(find /tmp/cosmocc -type f -name cosmocc | head -n1)"
          test -n "$COSMOCC"
          COSMOCC="$COSMOCC" sh toolchain/build.sh
      - name: Install Cosmopolitan build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y make bubblewrap
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build Machin bootstrap compiler
        run: |
          git clone --depth 1 https://github.com/javimosch/machin.git /tmp/machin
          (cd /tmp/machin && go build -o /tmp/machin-compiler .)
      - name: Install pinned Rust compiler and stage minimal sysroot
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-07-28 --profile minimal
          rustup target add aarch64-unknown-linux-gnu --toolchain nightly-2026-07-28
          RUSTC="$(rustup which --toolchain nightly-2026-07-28 rustc)"
          SYSROOT="$(dirname "$(dirname "$RUSTC")")"
          mkdir -p /tmp/rust-embedded/bin /tmp/rust-embedded/lib
          cp -a "$SYSROOT/bin/rustc" /tmp/rust-embedded/bin/
          cp -a "$SYSROOT/bin/cargo" /tmp/rust-embedded/bin/
          # Include rustc's shared libraries and the host-target core/metadata libraries.
          cp -a "$SYSROOT/lib/." /tmp/rust-embedded/lib/
          /tmp/rust-embedded/bin/rustc --version
      - name: Verify pinned Cargo resolves relocated configuration paths
        run: |
          python3 toolchain/tests/check_cargo_config_paths.py \
            --cargo /tmp/rust-embedded/bin/cargo \
            --rustc /tmp/rust-embedded/bin/rustc
      - name: Prepare patched Rust-APE SDK
        shell: bash
        run: |
          set -euo pipefail
          export COSMO_RUST_BUILD_ROOT="$GITHUB_WORKSPACE/o/rust-ape"
          bash third_party/rust_ape/run.sh setup
          test -s "$COSMO_RUST_BUILD_ROOT/sdk/generated/x86_64-unknown-linux-musl.json"
          test -x "$COSMO_RUST_BUILD_ROOT/sdk/vendor/cosmocc/bin/apelink"
      - name: Package patched Rust-APE SDK in unified toolchain
        shell: bash
        run: |
          set -euo pipefail
          COSMOCC="$(find /tmp/cosmocc -type f -name cosmocc | head -n1)"
          COSMOCC="$COSMOCC" COSMOCC_ROOT=/tmp/cosmocc \
            RUST_APE_SOURCE=third_party/rust_ape \
            RUST_COMPILER_ROOT=/tmp/rust-embedded \
            RUST_APE_SDK_ROOT="$GITHUB_WORKSPACE/o/rust-ape/sdk" \
            MACHIN=/tmp/machin-compiler MACHIN_SRC=/tmp/machin \
            bash toolchain/package-compiler-sdk.sh
      - name: Validate patched SDK payload inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          archive='o/toolchain/compiler-payload/cosmocc-sdk.zip'
          with zipfile.ZipFile(archive) as z:
              names=set(z.namelist())
              required={
                  'rust-ape-sdk/generated/x86_64-unknown-linux-musl.json',
                  'rust-ape-sdk/vendor/cosmocc/bin/apelink',
                  'rust-toolchain/bin/rustc',
                  'rust-toolchain/bin/cargo',
                  'rust-ape/run.sh',
              }
              missing=required-names
              assert not missing, f'Missing SDK resources: {missing}'
              print('PASS: patched SDK target, linker, Cargo and Rust compiler packaged')
          PY
      - name: Check embedded SDK status
        shell: bash
        run: |
          set -euo pipefail
          APE=o/toolchain/compiler-payload/toolchain-with-sdk.com
          "$APE" rust status | tee /tmp/rust-sdk-status.txt
          grep -Fx 'Patched Rust-APE SDK: packaged' /tmp/rust-sdk-status.txt
          "$APE" rust cargo --version
          "$APE" machin build toolchain/machin_demo.mfl -o /tmp/machin-embed-regression.com
          /tmp/machin-embed-regression.com | grep -Fx 'Machin linked into Cosmopolitan APE'
      - name: Prepare shared smoke-test artifact
        run: |
          cp /tmp/cosmocc/bin/ape-x86_64.elf o/toolchain/compiler-payload/
          cd o/toolchain/compiler-payload
          sha256sum toolchain-with-sdk.com ape-x86_64.elf > SHA256SUMS
      - name: Verify native status without writable temporary storage
        run: |
          sudo python3 toolchain/tests/check_native_status.py \
            --toolchain "$GITHUB_WORKSPACE/o/toolchain/compiler-payload/toolchain-with-sdk.com" \
            --ape-loader "$GITHUB_WORKSPACE/o/toolchain/compiler-payload/ape-x86_64.elf"
      - name: Verify SDK cleanup after a compiler failure
        run: |
          python3 toolchain/tests/check_sdk_lifecycle.py \
            --toolchain o/toolchain/compiler-payload/toolchain-with-sdk.com \
            --ape-loader o/toolchain/compiler-payload/ape-x86_64.elf
      - uses: actions/upload-artifact@v4
        with:
          name: native-zip-toolchain
          compression-level: 0
          retention-days: 7
          path: |
            o/toolchain/compiler-payload/toolchain-with-sdk.com
            o/toolchain/compiler-payload/ape-x86_64.elf
            o/toolchain/compiler-payload/SHA256SUMS
  compiler-smoke:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [c, cpp, rust, machin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-zip-toolchain
          path: artifact
      - name: Verify shared artifact
        run: |
          cd artifact
          sha256sum -c SHA256SUMS
          chmod +x toolchain-with-sdk.com ape-x86_64.elf
      - name: Compile and execute ${{ matrix.language }}
        run: |
          python3 toolchain/tests/smoke_compilers.py \
            --toolchain artifact/toolchain-with-sdk.com \
            --ape-loader artifact/ape-x86_64.elf \
            --output-dir "o/smoke-${{ matrix.language }}" \
            --language "${{ matrix.language }}"
          cd artifact
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-smoke-${{ matrix.language }}
          retention-days: 7
          path: o/smoke-${{ matrix.language }}
  rust-sdk-relocation:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-zip-toolchain
          path: artifact
      - name: Extract and move SDK components on a fresh runner
        run: |
          set -euo pipefail
          cd artifact
          sha256sum -c SHA256SUMS
          chmod +x toolchain-with-sdk.com ape-x86_64.elf
          cd ..
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
          cc -O2 -I. toolchain/tests/extract_sdk_test.c -lz -o "$RUNNER_TEMP/sdk-extractor"
          mkdir "$RUNNER_TEMP/sdk-export"
          "$RUNNER_TEMP/sdk-extractor" artifact/toolchain-with-sdk.com "$RUNNER_TEMP/sdk-export" rust
          "$RUNNER_TEMP/sdk-extractor" artifact/toolchain-with-sdk.com "$RUNNER_TEMP/sdk-export" ape
          mv "$RUNNER_TEMP/sdk-export" "$RUNNER_TEMP/relocated-sdk"
          test ! -e "$GITHUB_WORKSPACE/o/rust-ape/sdk"
          test ! -e "$RUNNER_TEMP/sdk-export"
      - name: Build standard-library application using relocated definitions
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/relocated-sdk/rust-ape-sdk"
          RUST="$RUNNER_TEMP/relocated-sdk/rust-toolchain"
          export PATH="$RUST/bin:$PATH"
          export RUSTC="$RUST/bin/rustc"
          export CARGO_HOME="$RUNNER_TEMP/relocated-cargo-home"
          export __CARGO_TESTS_ONLY_SRC_ROOT="$SDK/vendor/library"
          unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS COSMO
          cargo --version
          rustc --version
          cargo --config "$SDK/generated/cargo.cosmo.toml" \
            -Z json-target-spec -Z build-std=std,panic_abort,panic_unwind \
            -Z build-std-features= build --release \
            --target "$SDK/generated/x86_64-unknown-linux-musl.json" \
            --target-dir "$RUNNER_TEMP/relocated-target" \
            --manifest-path toolchain/tests/smoke/rust-std/Cargo.toml
      - name: Package and execute relocated standard-library output
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/relocated-sdk/rust-ape-sdk"
          DEBUG="$RUNNER_TEMP/relocated-target/x86_64-unknown-linux-musl/release/relocated_rust_std_smoke"
          if [ -f "$DEBUG.com.dbg" ]; then DEBUG="$DEBUG.com.dbg"; fi
          test -s "$DEBUG"
          mkdir -p o/relocation
          sh "$SDK/vendor/cosmocc/bin/apelink" \
            -l "$SDK/vendor/cosmocc/bin/ape-x86_64.elf" \
            -o o/relocation/rust-std.com "$DEBUG"
          artifact/ape-x86_64.elf o/relocation/rust-std.com | tee o/relocation/result.txt
          grep -Fx 'RUST RELOCATED STD PASS: 42' o/relocation/result.txt
          cd artifact
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relocated-rust-std
          retention-days: 7
          path: o/relocation
