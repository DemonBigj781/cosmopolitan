name: Unified APE toolchain bootstrap
on:
  push:
    branches: [machin-cosmopolitan]
    paths:
      - 'toolchain/**'
      - '.github/actions/toolchain-bootstrap/**'
      - 'build/download-cosmocc.sh'
      - 'third_party/rust_ape/upstream/xtask/src/config.rs'
      - 'third_party/rust_ape/upstream/rust-toolchain.toml'
      - '.github/workflows/unified-ape-toolchain.yml'
  workflow_dispatch:
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bootstrap pinned toolchain inputs
        id: bootstrap
        uses: ./.github/actions/toolchain-bootstrap
      - name: Build and smoke-test single APE
        run: |
          COSMOCC="$(find /tmp/cosmocc -type f -name cosmocc | head -n1)"
          test -n "$COSMOCC"
          chmod +x "$COSMOCC"
          COSMOCC="$COSMOCC" sh toolchain/build.sh
          ./o/toolchain/toolchain.com version
          ./o/toolchain/toolchain.com selftest
      - name: Experiment - link Machin-generated C into the same APE
        run: |
          COSMOCC="$(find /tmp/cosmocc -type f -name cosmocc | head -n1)"
          MACHIN=/tmp/machin-compiler COSMOCC="$COSMOCC" sh toolchain/machin-link.sh
          ./o/toolchain/toolchain.com version
          ./o/toolchain/toolchain.com machin-demo | grep -F "Machin linked into Cosmopolitan APE"
      - name: Link self-hosted Machin compiler into single APE
        run: |
          COSMOCC="$(find /tmp/cosmocc -type f -name cosmocc | head -n1)"
          MACHIN=/tmp/machin-compiler MACHIN_SRC=/tmp/machin COSMOCC="$COSMOCC" sh toolchain/selfhost-link.sh
      - name: Roundtrip - embedded Machin generates a second APE
        run: |
          COSMOCC="$(find /tmp/cosmocc -type f -name cosmocc | head -n1)"
          COSMOCC="$COSMOCC" sh toolchain/roundtrip-ape.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unified-toolchain-bootstrap-ape
          path: |
            o/toolchain/toolchain.com
            o/toolchain/roundtrip/generated.com
            o/toolchain/roundtrip/output.txt
